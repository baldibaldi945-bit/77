name: Build ModBridge APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -q ModBridge.zip -d project
          ROOT=$(dirname "$(find project -name settings.gradle.kts | head -n 1)")
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 SDK packages (preinstalled SDK)
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run core tests and build debug APK
        working-directory: ${{ env.ROOT }}
        run: gradle test assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ModBridge-debug-apk
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/app-debug.apk
